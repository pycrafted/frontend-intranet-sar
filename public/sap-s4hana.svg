<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond blanc -->
  <rect width="200" height="200" fill="white" rx="16"/>

  <!-- Losange SAP bleu gradient -->
  <defs>
    <linearGradient id="sapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0070D2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bloc SAP (parallélogramme stylisé) -->
  <polygon points="20,40 140,40 180,100 140,160 20,160 60,100" fill="url(#sapGrad)"/>

  <!-- Texte SAP blanc -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="52" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-1">SAP</text>

  <!-- Texte S/4HANA en dessous -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="700"
        fill="#0070D2" text-anchor="middle" letter-spacing="1">S/4HANA</text>
</svg>
